<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Zones Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Zone HUD indicator (always in DOM, shown/hidden by JS) ── -->
<div id="zoneHUD" class="hud-hidden">
    <div id="hudIcon">🛡</div>
    <div id="hudText">
        <span id="hudTitle">SAFE ZONE</span>
        <span id="hudName">Zone Name</span>
        <span id="hudStatus">Combat Restricted</span>
    </div>
</div>

<!-- ── Main admin container ────────────────────────────────────── -->
<div id="container" class="hidden">
    <div class="header">
        <div class="header-icon">🔒</div>
        <h1>Safe Zones Manager</h1>
        <p>Admin Panel · Combat Restricted Areas</p>
    </div>

    <div class="section">
        <h2>➕ Add New Safe Zone</h2>

        <label>Zone Name</label>
        <input type="text" id="zoneName" placeholder="e.g. City Hall" autocomplete="off" />

        <div class="coord-row">
            <div class="coord-field">
                <label>X</label>
                <input type="number" id="cx" placeholder="0.00" step="0.01" />
            </div>
            <div class="coord-field">
                <label>Y</label>
                <input type="number" id="cy" placeholder="0.00" step="0.01" />
            </div>
            <div class="coord-field">
                <label>Z</label>
                <input type="number" id="cz" placeholder="0.00" step="0.01" />
            </div>
        </div>

        <div class="hint" id="coordHint">Stand at the desired location and use <strong>/addsafepoint</strong> to auto-fill coordinates.</div>

        <div class="two-col">
            <div>
                <label>Radius (m)</label>
                <input type="number" id="radius" value="80" min="5" step="1" />
            </div>
            <div>
                <label>Height (m)</label>
                <input type="number" id="height" value="20" min="2" step="1" />
            </div>
        </div>

        <button class="btn-create" onclick="addNewZone()">✔ Create Safe Zone</button>
    </div>

    <div class="section">
        <h2>📋 Existing Safe Zones <span id="zoneCount" class="badge">0</span></h2>
        <div id="zoneList"></div>
    </div>

    <button class="close-btn" onclick="closeMenu()">✖ Close</button>
</div>

<!-- ── Confirm delete modal ────────────────────────────────────── -->
<div id="confirmModal" class="modal-overlay hidden">
    <div class="modal">
        <div class="modal-icon">⚠️</div>
        <h3>Delete Safe Zone?</h3>
        <p id="confirmText">This action cannot be undone.</p>
        <div class="modal-buttons">
            <button class="btn-cancel"  onclick="cancelDelete()">Cancel</button>
            <button class="btn-confirm" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
